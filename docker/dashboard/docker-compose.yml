# Dashboard VM — Docker 실행
#   docker compose -f docker/dashboard/docker-compose.yml up -d --build
# (저장소 루트에서는 `make docker-build` / `make docker-start` 로도 실행 가능)

services:
  dashboard:
    build:
      context: ../..                       # 빌드 컨텍스트 = 저장소 루트
      dockerfile: docker/dashboard/Dockerfile
    image: nginx-api-discovery:latest
    container_name: nginx-api-discovery
    ports:
      - "8080:8080"
    volumes:
      # 분석 결과 및 SQLite DB 영구 보관 (경로는 이 compose 파일 기준 상대경로)
      - ../../output:/app/output
      # 설정 파일
      - ../../config:/app/config:ro
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      # 에이전트 인증 토큰 — 비밀값은 이미지/설정파일이 아니라 env로 주입한다.
      # 같은 디렉토리의 .env(gitignore됨)에 INGEST_TOKEN=... 로 넣으면 자동 로드된다.
      - INGEST_TOKEN=${INGEST_TOKEN:-}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
